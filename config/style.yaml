# Global visual + timing style. Presets in config/presets/<name>.yaml are deep-merged on top.

video:
  width: 1080
  height: 1920
  fps: 30
  codec: libx264
  crf: 21
  preset: medium
  maxrate: 9M              # cap for social platforms (keeps 3-min videos ~120-200 MB)
  bufsize: 18M
  pix_fmt: yuv420p
  audio_codec: aac
  audio_bitrate: 192k
  sample_rate: 48000

render:
  workers: 0               # parallel render processes (0 = number of CPU cores, 1 = off)

palette:
  outline: "#1d1d22"
  highlight: "#F5A623"
  text: "#FFFFFF"
  shadow: "#000000"

outline_width: 8

caption:
  font: library/fonts/Montserrat-ExtraBold.ttf
  size: 112                # px
  uppercase: true
  center_y: 0.77           # vertical center of caption block (fraction of height)
  max_width: 0.86          # fraction of width
  max_words_per_page: 3
  break_after: ".!?;:,"    # a page ends after a word ending with one of these
  strip_punctuation: ".,;:"  # removed from displayed words ("?" and "!" stay)
  line_height: 1.12        # x font size
  word_gap: 0.22           # x font size (visible gap, stroke excluded)
  stroke_width: 16
  stroke_color: "#1d1d22"
  shadow:
    dx: 0
    dy: 10
    blur: 8
    alpha: 0.55
  pop:
    duration: 0.14         # seconds of the pop-in animation per word
    from_scale: 0.5
    overshoot: 1.7         # easeOutBack strength
  lead: 0.03               # show word slightly before it is spoken (s)
  active_scale: 1.06       # word being spoken right now
  hold_after: 0.35         # keep the last page on screen after speech (s)
  dialogue_font: library/fonts/Montserrat-ExtraBoldItalic.ttf   # character lines (narration stays upright)
  tag:                     # speaker pill above character lines
    enabled: true
    font: library/fonts/Montserrat-Black.ttf
    size: 0.36             # x caption size
    gap: 0.25
    text_color: "#FFFFFF"
    colors: ["#2F6FD6", "#E07B24", "#2E9B57", "#B8322E", "#7A4FD0", "#D14A8B"]   # assigned per character

grain:
  enabled: true
  amount: 0.07             # 0..1 opacity of the noise layer
  variants: 6              # pre-generated noise frames
  scale: 2                 # grain pixel size (1 = per-pixel noise: sharp but hard to compress)
  fps: 12                  # how fast the grain changes

vignette:
  enabled: true
  strength: 0.55           # alpha at the corners
  inner: 0.45              # fraction of radius that stays clear

timing:
  pre_roll: 0.10           # silence before a line starts inside its shot (s)
  breath_after: 0.30       # silence after the line before cutting (s)
  min_shot: 1.0            # minimum shot length (s)
  default_shot: 2.0        # length of shots without a line and without duration
  target_duration: [45, 75]   # seconds; validate.py warns outside this range

audio:
  loudnorm: true
  target_lufs: -14
  true_peak: -1.5
  lra: 11
  voice_gain_db: 0.0
  sfx_gain_db: -5.0
  music:
    default_mood: null     # mood used when the screenplay sets none (null = no music)
    bed_db: -9             # music level vs. speech when screenplay music.volume = 0.15 (scales linearly)
    duck_db: -9            # music level change while someone speaks
    duck_threshold_db: -42
    duck_attack: 0.08
    duck_release: 0.45
  # sounds added automatically from what happens on screen (set any to null to disable)
  auto_sfx:
    enabled: true
    whip: {name: whoosh, offset: -0.2, volume: 0.75}       # offset from the cut
    flash: {name: flash, offset: -0.06, volume: 0.6}
    fade: null
    punch: {name: hit, volume: 0.9}                         # x camera punch
    card: {name: pop, volume: 0.7}
    poll: {name: pop, volume: 0.6}
    ending: {name: boom, volume: 0.6}
    props:                                                  # by prop animation or svg name
      pop: {name: pop, volume: 0.5}
      drop: {name: drop, volume: 0.6}
      ring: {name: ring, volume: 0.45, loop: true}          # lasts the whole shot
      notification: {name: notify, volume: 0.7}

tts:
  backends: [edge, piper, espeak]   # tried in order
  rate: "+6%"                       # edge-tts speaking rate
  pitch: "+0Hz"
  align: auto                       # auto | edge | whisper | estimate

character:
  rig: default             # body variant: default | tall (config/rigs/)

background:
  render_scale: 1.5        # backgrounds rendered larger than the frame for sharper close-ups
  blur: 0                  # default depth-of-field blur (px); scenes/shots can override

props:
  outline_px: 8            # constant outline thickness of SVG props, in output pixels
  supersample: 2.0         # rasterize props larger so camera zoom stays sharp

camera:
  shake_amp: 0.012         # x frame width, for shake = 1
  punch_amp: 0.04          # x frame width, for punch = 1
  punch_decay: 0.22        # s
  target_frame_y: 0.42     # where a camera target lands on screen (fraction of height)

transitions:
  whip:  {duration: 0.26, blur: 70}
  flash: {duration: 0.18, color: "#FFFFFF"}
  fade:  {duration: 0.40, color: "#000000"}

lighting:
  color: "#04060B"         # darkness tint
  glow: "#FFE7A8"          # warm light tint
  glow_alpha: 0.30
  edge_blur: 18            # px softness of light edges

overlays:
  badge:                   # top-left series label + story clock
    x: 0.065
    y: 0.075
    font: library/fonts/Montserrat-Black.ttf
    label_size: 30
    clock_size: 84
    clock_color: "#FFFFFF"
  card:                    # centered text card (rules, warnings)
    width: 0.80
    padding: 44
    size: 64
    title_size: 38
    bg: "#121418"
    bg_alpha: 0.93
    title_bg: "#D93A3A"
  poll:                    # numbered option bars
    width: 0.84
    height: 128
    gap: 22
    bottom: 0.905          # bottom edge of the last bar (fraction of height)
    size: 44
    detail_size: 29
    bg: "#F6F3EC"
    text_color: "#1d1d22"
    detail_color: "#6B6258"
  end:                     # end card
    y: 0.22
    headline_size: 74
    badge_size: 92
    cta_size: 40

ending:                    # end card background (last set, blurred and darkened)
  blur: 14
  darkness: 0.55
  caption_y: 0.62
