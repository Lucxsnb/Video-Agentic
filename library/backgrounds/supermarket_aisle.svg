<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F3B37"/><stop offset="1" stop-color="#3E4E48"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6E7478"/><stop offset="1" stop-color="#3C4044"/></linearGradient>
    <pattern id="prod" width="216" height="150" patternUnits="userSpaceOnUse">
      <g stroke="#1d1d22" stroke-width="5" stroke-linejoin="round">
        <rect x="8" y="40" width="34" height="104" rx="5" fill="#C8432B"/>
        <rect x="48" y="58" width="44" height="86" rx="4" fill="#E9C23A"/>
        <rect x="98" y="30" width="30" height="114" rx="8" fill="#3B6EA5"/>
        <rect x="134" y="70" width="38" height="74" rx="4" fill="#5BA36B"/>
        <rect x="178" y="48" width="30" height="96" rx="5" fill="#E08A3C"/>
      </g>
      <g fill="#ffffff" opacity="0.55"><rect x="14" y="80" width="22" height="16"/><rect x="54" y="90" width="32" height="14"/><rect x="104" y="70" width="18" height="24"/><rect x="140" y="96" width="26" height="12"/><rect x="184" y="84" width="18" height="18"/></g>
    </pattern>
    <pattern id="tiles" width="180" height="90" patternUnits="userSpaceOnUse">
      <path d="M0 0 H180 M0 0 V90" stroke="#2c3034" stroke-width="4" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1080" height="1920" fill="url(#wall)"/>
  <rect y="250" width="1080" height="60" fill="#2E8B57" opacity="0.85"/>
  <rect y="306" width="1080" height="8" fill="#1d1d22" opacity="0.5"/>
  <!-- shelf unit -->
  <rect x="-10" y="380" width="1100" height="900" fill="#262B2E" stroke="#1d1d22" stroke-width="8"/>
  <g>
    <rect x="-200" y="400" width="1500" height="146" fill="url(#prod)"/>
    <rect x="-74" y="580" width="1500" height="146" fill="url(#prod)"/>
    <rect x="-24" y="760" width="1500" height="146" fill="url(#prod)"/>
    <rect x="-114" y="940" width="1500" height="146" fill="url(#prod)"/>
    <rect x="-44" y="1120" width="1500" height="146" fill="url(#prod)"/>
  </g>
  <g fill="#B9C0C4" stroke="#1d1d22" stroke-width="6">
    <rect x="-10" y="548" width="1100" height="26"/><rect x="-10" y="728" width="1100" height="26"/>
    <rect x="-10" y="908" width="1100" height="26"/><rect x="-10" y="1088" width="1100" height="26"/>
    <rect x="-10" y="1262" width="1100" height="30"/>
  </g>
  <g fill="#F2EDE1" stroke="#1d1d22" stroke-width="3">
    <rect x="120" y="552" width="70" height="18"/><rect x="520" y="732" width="70" height="18"/>
    <rect x="820" y="912" width="70" height="18"/><rect x="300" y="1092" width="70" height="18"/>
  </g>
  <rect x="0" y="1290" width="1080" height="630" fill="url(#floor)"/>
  <rect x="0" y="1290" width="1080" height="630" fill="url(#tiles)"/>
  <path d="M0 1290 H1080" stroke="#1d1d22" stroke-width="8"/>
  <ellipse cx="540" cy="1500" rx="420" ry="60" fill="#ffffff" opacity="0.05"/>
</svg>
