<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121826"/><stop offset="1" stop-color="#22304A"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E3440"/><stop offset="1" stop-color="#171A21"/></linearGradient>
    <pattern id="bricks" width="160" height="80" patternUnits="userSpaceOnUse">
      <rect width="160" height="80" fill="#3B4660"/>
      <path d="M0 0 H160 M0 40 H160 M0 0 V40 M80 0 V40 M40 40 V80 M120 40 V80" stroke="#252D40" stroke-width="5"/>
