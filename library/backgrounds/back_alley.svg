  <path d="M700 420 h100 l-20 40 h-60 z" fill="#30333A" stroke="#1d1d22" stroke-width="6"/>
  <ellipse cx="750" cy="462" rx="30" ry="8" fill="#FFE7A8"/>
  <rect x="0" y="1340" width="1080" height="580" fill="url(#ground)"/>
