  </defs>
  <rect width="1080" height="1920" fill="url(#sky)"/>
  <rect y="160" width="1080" height="1180" fill="url(#bricks)"/>
  <!-- metal door -->
  <rect x="560" y="560" width="380" height="780" fill="#4A5566" stroke="#1d1d22" stroke-width="10"/>
  <rect x="600" y="610" width="300" height="300" fill="#556275" stroke="#1d1d22" stroke-width="5"/>
  <rect x="600" y="960" width="300" height="320" fill="#556275" stroke="#1d1d22" stroke-width="5"/>
  <rect x="880" y="940" width="26" height="90" rx="8" fill="#9BA3AD" stroke="#1d1d22" stroke-width="5"/>
  <rect x="640" y="720" width="220" height="70" fill="#F2EDE1" stroke="#1d1d22" stroke-width="5"/>
  <text x="750" y="766" font-family="Montserrat" font-weight="900" font-size="25" fill="#C8432B" text-anchor="middle">KEEP CLOSED</text>
